[project]
name = "deep-learning-notes"
version = "2026.10.02"
keywords = [
    "deep learning tutorial",
    "computer vision",
    "natural language processing",
    "large language model",
    "pytorch",
    "quarto",
    "jupyter notebook",
    "typst",
]
description = "A collection of notes and code examples for deep learning concepts and techniques."
authors = [{ name = "jshn9515", email = "jshn9510@gmail.com" }]
readme = "README.md"
license = "CC-BY-NC-4.0"
requires-python = ">=3.14,<3.15"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Operating System :: OS Independent",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    # PyTorch ecosystem
    "torch[opt-einsum,pyyaml]>=2.15.0,<2.16.0",
    "torchaudio>=2.11.0,<2.12.0",
    "torchcodec>=0.17.0,<0.18.0",
    "torchvision[gdown,scipy]>=0.29.0,<0.30.0",
    "torchinfo>=1.8.0,<1.9.0",
    "torchmetrics>=1.9.0,<1.10.0",

    # Hugging Face ecosystem
    "accelerate>=1.15.0,<1.16.0",
    "datasets[audio,torch,vision]>=5.1.0,<5.2.0",
    "diffusers[torch]>=0.42.0,<0.43.0",
    "kernels[torch]>=0.17.0,<0.18.0",
    "tokenizers>=0.23.0,<0.24.0",
    "transformers[torch,vision,kernels]>=5.22.0,<5.23.0",

    # LLM
    "openai[aiohttp,datalib]>=3.30.0,<4.0.0",

    # High performance kernels
    "triton>=3.8.0,<3.9.0; sys_platform == 'linux'",
    "xformers==0.0.35",

    # Scientific computing and machine learning
    "numpy>=2.5.0,<2.6.0",
    "scipy>=1.18.0,<1.19.0",

    # Data processing and visualization
    "pandas[plot]>=3.1.0,<3.2.0",
    "pillow>=13.0.0,<13.1.0",
    "matplotlib>=3.11.0,<3.12.0",

    # Jupyter and interactive development
    "ipython[matplotlib]>=9.15.0",
    "ipywidgets>=8.1.0",
    "jupyter-cache>=1.0.0",
    "jupyterlab>=4.5.0",

    # Code formatting and linting
    "ruff>=0.17.0,<0.18.0",

    # DNNL utilities
    "dnnlpy==2026.10.02",
]

[project.urls]
Homepage = "https://github.com/jshn9515/deep-learning-notes"

[dependency-groups]
cpu = [
    "torch>=2.15.0,<2.16.0",
    "torchaudio>=2.11.0,<2.12.0",
    "torchcodec>=0.17.0,<0.18.0",
    "torchvision>=0.29.0,<0.30.0",
]

[tool.uv]
torch-backend = "cpu"

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
dnnlpy = { workspace = true }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.workspace]
members = ["dnnlpy"]

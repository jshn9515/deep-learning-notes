[project]
name = "dnnlpy"
version = "2026.10.02"
keywords = ["deep learning", "pytorch", "utilities"]
description = "A utility library for deep learning notes, providing common functions and tools to support the main content of the deep learning notes collection."
authors = [{ name = "Yunjie Lin", email = "jshn9510@gmail.com" }]
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.15"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Operating System :: OS Independent",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    # PyTorch ecosystem
    "torch[opt-einsum,pyyaml]>=2.14.0,<2.15.0",
    "torchmetrics>=1.9.0,<1.10.0",

    # Hugging Face and tokenization
    "datasets[audio,torch,vision]>=5.1.0,<5.2.0",
    "tokenizers>=0.23.0,<0.24.0",
    "transformers[torch,vision,kernels]>=5.22.0,<5.23.0",

    # Scientific computing and visualization
    "numpy>=2.5.0,<2.6.0",
    "matplotlib>=3.11.0,<3.12.0",

    # Utilities
    "psutil>=7.2.0,<7.3.0",
    "pydantic[timezone]>=2.14.0,<2.15.0",
    "ruff>=0.17.0,<0.18.0",
]

[project.optional-dependencies]
docs = [
    "furo==2025.12.19",
    "sphinx>=9.2.0,<9.3.0",
    "sphinx-autoapi>=3.8.0,<3.9.0",
]
notebook = [
    "ipython[matplotlib]>=9.15.0",
    "ipywidgets>=8.1.0",
    "jupyterlab>=4.5.0",
]
rl = [
    "gymnasium[array-api,classic-control,torch]>=1.4.0,<1.5.0",
    "pygame-ce>=2.5.0,<2.6.0",
    "torchrl[video]>=0.14.0,<0.15.0",
]
test = ["pytest>=9.2.0,<9.3.0", "tiktoken>=0.14.0,<0.15.0"]

[project.urls]
Homepage = "https://github.com/jshn9515/deep-learning-notes"

[project.scripts]
dnnlpy-cs221-a4-train = "dnnlpy.cli.cs221.assignment4.train:main"

[tool.uv]
torch-backend = "cpu"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
